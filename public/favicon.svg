<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1f2438" stroke-width="3"/>

  <!-- Top 4U Master Blade with Gold Glow -->
  <rect x="22" y="24" width="84" height="20" rx="6" fill="#121524" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="34" cy="34" r="3" fill="#ffd700"/>
  <circle cx="44" cy="34" r="2" fill="#00ff66"/>
  <rect x="56" y="32" width="38" height="4" rx="2" fill="#ffd700" opacity="0.85"/>

  <!-- Middle 2U Blade with Neon Cyan Glow -->
  <rect x="22" y="52" width="84" height="18" rx="6" fill="#121524" stroke="url(#cyanGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="34" cy="61" r="3" fill="#00d4ff"/>
  <circle cx="44" cy="61" r="2" fill="#00ff66"/>
  <rect x="56" y="59" width="38" height="4" rx="2" fill="#00d4ff" opacity="0.85"/>

  <!-- Bottom 2U Blade with Cyan Accents -->
  <rect x="22" y="78" width="84" height="18" rx="6" fill="#121524" stroke="#00d4ff" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="34" cy="87" r="3" fill="#00d4ff" opacity="0.8"/>
  <circle cx="44" cy="87" r="2" fill="#00ff66"/>
  <rect x="56" y="85" width="38" height="4" rx="2" fill="#00d4ff" opacity="0.6"/>

  <!-- Active Power Pulse Dot -->
  <circle cx="106" cy="22" r="4.5" fill="#00ff66"/>
</svg>
